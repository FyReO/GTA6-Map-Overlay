name: Release app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.22.3 pyinstaller-hooks-contrib==2026.10

      - name: Stamp version from the tag
        shell: python
        run: |
          import os, pathlib
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          pathlib.Path("gta6overlay/version.py").write_text(f'__version__ = "{version}"\n')

      - name: Build exe
        run: pyinstaller --noconfirm GTA6MapOverlay.spec

      - name: Smoke test
        shell: pwsh
        run: |
          $p = Start-Process dist\GTA6MapOverlay.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest failed with exit code $($p.ExitCode)" }

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\GTA6MapOverlay.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  GTA6MapOverlay.exe" | Out-File -Encoding ascii dist\GTA6MapOverlay.exe.sha256

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/GTA6MapOverlay.exe
            dist/GTA6MapOverlay.exe.sha256
          generate_release_notes: true
